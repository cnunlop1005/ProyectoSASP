<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content="width=device-width, initial-scale=1.0">
        <title>ReCode | Reutilización tecnológica sostenible</title>
        
        <!-- Hoja de estilos común -->
        <link rel="stylesheet" href="styles.css">
	
	    <!-- JavaScript -->
        <script src="main.js" defer></script>
    </head>
    <body>
        <!-- ===== HEADER ===== -->
        <header>
            <h1>ReCode</h1>
            <h2>Producto</h2>
            <nav>
                <ul class = "indice">
                    <li><a href = "#compra">Compra de productos</a></li>
                    <li><a href = "#cesta">Cesta</a></li>
                    <li><a href = "#comentarios">Comentarios</a></li>
                </ul>
            </nav>
        </header>

        <!-- ===== MAIN ===== -->
        <main>

            <section id = "compra">
                <h2>Encargo de productos</h2>
                <div id = "productos" class = "productos">
                    <!-- Añadir imagenes de productos con boton que diga añadir a la cesta y que con un javascript se añadan a una lista junto con su precio -->
                    <div id = "hardware">
                        <h3>Hardware</h3>
                        <img src = "ordenador.png">
                        <label for = "ordenador" class = "producto">Ordenador</label>
                        <input type = "checkbox" id = "ordenador">
                        <img src = "teclado.png">
                        <label for = "teclado" class = "producto">Teclado</label>
                        <input type = "checkbox" id = "teclado">
                        <img src = "raton.png">
                        <label for = "raton" class = "producto">Ratón</label>
                        <input type = "checkbox" id = "raton">
                    </div>
                    <div id = "software">
                        <h3>Software</h3>
                        <img src = "web.png">
                        <label for = "web">Página web</label>
                        <input type = "checkbox" id = "web">
                        <img src = "gestion.png">
                        <label for = "gestion">Programa de gestión de datos</label>
                        <input type = "checkbox" id = "gestion">
                        <img src = "galeria.png">
                        <label for = "estadisticas">Gráficos y galerías</label>
                        <input type = "checkbox" id = "estadisticas">
                    </div>
                </div>
            </section>

            <section id = "cesta">
                <h2>Cesta</h2>
                <ul id = "listaCesta">
                    
                </ul>
            </section>

            <section id = "comentarios">
                <h2>Comentarios</h2>
                <form class = "comentarios">
                    <label for = "nombre" class = "label">Nombre: </label>
                    <input type = "text" id = "nombre" placeholder = "Nombre...">
                    <label for = "email" class = "label">Email: </label>
                    <input type = "text" id = "email" placeholder = "Email...">
                    <label for = "comentario" class = "label">Comentario: </label>
                    <input type = "text" id = "comentario" placeholder = "Escriba aqui su comentario...">
                    <button class = "btnenviar" id = "btnenviar">Enviar</button>
                </form>
            </section>

            <section class = "vuelta">
                <h3>Volver a la página principal</h3>
                <div><a href = "index.html">Volver a la pagina principal</a></div>
            </section>

        </main>

        <!-- ===== FOOTER ===== -->
            <footer>
                <p>2026 ReCode – Proyecto educativo | CFGS DAM</p>
                <p>Sostenibilidad aplicada al sistema productivo</p>
            </footer>
    </body>

</html>
